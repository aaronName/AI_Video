<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片編輯介面</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .editor-container {
            position: relative; /* Make this the positioning context */
            width: 90%;
            max-width: 900px;
            height: 600px;
            border: 2px solid #212529;
            background-color: white;
            background-image:
                radial-gradient(#e9ecef 1px, transparent 1px);
            background-size: 10px 10px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: grid; /* Using grid for the main content layout */
            grid-template-columns: 3fr 4fr 2fr;
            grid-template-rows: 4fr 4fr 1fr; /* Two rows for the content */
            gap: 10px;
        }
        .short-video-panel,
        .suggestion-panel {
            border: 1px solid #dee2e6;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            background-color: #f8f9fa;
        }
        .short-video-panel {
            grid-column: 1;
            grid-row: 1;
        }
        .graph-chart-panel {
            border: 1px solid #dee2e6;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            background-color: #f8f9fa;
            grid-column: 2;
            grid-row: 1;
        }
        .ai-chat-panel {
            border: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            background-color: #f8f9fa;
            grid-column: 3;
            grid-row: 1 / 3; /* Span both rows */
        }
        .suggestion-panel {
            grid-column: 1 / 3; /* Span two columns */
            grid-row: 2;
        }
        .option-title {
            font-weight: bold;
            color: #495057;
        }
        .prev-btn {
            position: absolute; /* Absolutely position the button */
            bottom: 30px;
            left: calc(20px + 1px); /* Adjust left by padding + border */
        }
    </style>
</head>
<body>
    <div class="editor-container">
        <div class="short-video-panel">
            <div class="option-title">短影音</div>
        </div>
        <div class="graph-chart-panel">
            <div class="option-title">圖表</div>
        </div>
        <div class="ai-chat-panel">
            <div class="option-title">AI對話</div>
        </div>
        <div class="suggestion-panel">
            <div class="option-title">建議</div>
        </div>
        <a href="{{ url_for('page3') }}" class="btn btn-secondary prev-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
            </svg>
            <span>上一步</span>
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
